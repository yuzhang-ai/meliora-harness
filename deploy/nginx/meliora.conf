# Candidate only: install this entire file as /etc/nginx/sites-available/meliora
# and link it from sites-enabled. Ubuntu includes sites-enabled/* directly in
# the http context; never paste this file inside an existing server block.
# Test with nginx -t before enabling. The Node API remains loopback-only.
# These zones are intentionally small for a single-teacher demo.
limit_req_zone $binary_remote_addr zone=meliora_api_per_ip:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=meliora_api_connections:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/melioracode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melioracode.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name melioracode.com www.melioracode.com;

    root /var/www/letsencrypt;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name melioracode.com www.melioracode.com;

    # This final-site candidate is installed only after the TLS gate has
    # created these files. Never expose Basic Auth over plain HTTP.
    ssl_certificate /etc/letsencrypt/live/melioracode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melioracode.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    auth_basic "Meliora teacher demonstration";
    auth_basic_user_file /etc/nginx/.htpasswd-meliora;

    root /srv/meliora/app/current/apps/web/dist;
    index index.html;

    location /api/ {
        limit_req zone=meliora_api_per_ip burst=10 nodelay;
        limit_conn meliora_api_connections 8;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        # The loopback Server owns an exact Host allowlist. Preserve the public
        # host separately while presenting only the fixed upstream authority.
        proxy_set_header Host 127.0.0.1:8787;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve EventSource delivery and terminal 204/409 responses.
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no always;
        # Defining X-Accel-Buffering here disables normal parent add_header
        # inheritance, so repeat the security headers for API responses.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Never retry a state-changing command upstream. A browser retry is
        # deliberately visible to the durable command layer; an Nginx retry is not.
        proxy_next_upstream off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
