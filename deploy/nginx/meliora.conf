# Candidate only: replace the server_name and the htpasswd path outside Git.
# Test with nginx -t before enabling. The Node API remains loopback-only.
server {
    listen 443 ssl http2;
    server_name melioracode.com www.melioracode.com;

    # This final-site candidate is installed only after the TLS gate has
    # created these files. Never expose Basic Auth over plain HTTP.
    ssl_certificate /etc/letsencrypt/live/melioracode.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melioracode.com/privkey.pem;

    auth_basic "Meliora teacher demonstration";
    auth_basic_user_file /etc/nginx/.htpasswd-meliora;

    root /srv/meliora/app/current/apps/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        # The loopback Server owns an exact Host allowlist. Preserve the public
        # host separately while presenting only the fixed upstream authority.
        proxy_set_header Host 127.0.0.1:8787;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve EventSource delivery and terminal 204/409 responses.
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no always;

        # Never retry a state-changing command upstream. A browser retry is
        # deliberately visible to the durable command layer; an Nginx retry is not.
        proxy_next_upstream off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
