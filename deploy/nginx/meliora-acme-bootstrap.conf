# Bootstrap only. Install this entire file as
# /etc/nginx/sites-available/meliora and link it from sites-enabled. This server
# must not expose the Web app or /api. Replace it with meliora.conf only after
# certificate issuance.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name melioracode.com www.melioracode.com;

    root /var/www/letsencrypt;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
